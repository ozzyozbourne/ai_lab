# Minimal outbound tunnel-mode ESP (AES-128-GCM) for dpdk-ipsec-secgw, lookaside-none (plain cryptodev).
# Port 0 = unprotected (cleartext in), port 1 = protected (ESP out).
sp ipv4 out esp protect 5 pri 1 dst 10.0.0.0/24 sport 0:65535 dport 0:65535
sa out 5 aead_algo aes-128-gcm aead_key 01:02:03:04:05:06:07:08:09:0a:0b:0c:0d:0e:0f:10:11:12:13:14 mode ipv4-tunnel src 172.16.1.5 dst 172.16.2.5
rt ipv4 dst 172.16.2.5/32 port 1
# inbound side (needed by the app whenever an unprotected port is configured)
sp ipv4 in esp protect 6 pri 1 dst 192.168.0.0/24 sport 0:65535 dport 0:65535
sa in 6 aead_algo aes-128-gcm aead_key 01:02:03:04:05:06:07:08:09:0a:0b:0c:0d:0e:0f:10:11:12:13:14 mode ipv4-tunnel src 172.16.2.5 dst 172.16.1.5
rt ipv4 dst 192.168.0.0/24 port 0
