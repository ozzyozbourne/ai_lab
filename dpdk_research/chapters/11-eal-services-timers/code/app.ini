; Chapter 11 step 5 configuration, read with rte_cfgfile_load().
; Format: INI. [section] headers, "name = value" entries, ';' starts a comment.
; Command-line options override every value here.

[forward]
burst = 32
; pairN = rx_port,tx_port : frames received on rx_port are sent on tx_port
pair0 = 0,1
pair1 = 1,0

[stats]
interval_ms = 500

[keepalive]
period_ms = 250
stall_after = 0
